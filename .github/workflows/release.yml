name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump strategy (auto, patch, minor, major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -race -v ./...

  release:
    name: Create GitHub Release
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Determine Release Version
        id: version
        run: |
          # Fetch all tags so we know all existing release versions
          git fetch --tags --force

          # If triggered by a tag push (refs/tags/v*), use that tag directly
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            echo "Triggered by tag push: ${TAG_NAME}"
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MANUAL_BUMP="${{ inputs.bump }}"

          # Check if current HEAD is already tagged with a semver release tag
          CURRENT_TAG=$(git tag --points-at HEAD "v[0-9]*.[0-9]*.[0-9]*" | head -n 1)
          if [ -n "$CURRENT_TAG" ] && [ "$MANUAL_BUMP" != "patch" ] && [ "$MANUAL_BUMP" != "minor" ] && [ "$MANUAL_BUMP" != "major" ]; then
            echo "HEAD is already tagged as $CURRENT_TAG and no manual bump requested. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the latest semantic version tag
          LATEST_TAG=$(git tag -l "v*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
          echo "Latest existing tag: ${LATEST_TAG:-none}"

          if [ -z "$LATEST_TAG" ]; then
            # Initial release version baseline
            NEW_VERSION="1.0.0"
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)

            BUMP="patch"
            if [ -n "$MANUAL_BUMP" ] && [ "$MANUAL_BUMP" != "auto" ]; then
              BUMP="$MANUAL_BUMP"
            else
              COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s%n%b")
              if echo "$COMMITS" | grep -qE "(BREAKING CHANGE|breaking:|^[a-zA-Z]+(\([a-zA-Z0-9_-]+\))?!:)"; then
                BUMP="major"
              elif echo "$COMMITS" | grep -qE "^feat(\([a-zA-Z0-9_-]+\))?:"; then
                BUMP="minor"
              fi
            fi

            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG_NAME="v${NEW_VERSION}"
          echo "Next release version: ${NEW_VERSION}"
          echo "Next release tag: ${TAG_NAME}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build Multi-Platform Release Binaries
        if: steps.version.outputs.skip != 'true'
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          COMMIT=${GITHUB_SHA::7}
          LDFLAGS="-X main.version=${TAG_NAME} -X main.commit=${COMMIT} -X main.date=${DATE} -s -w"

          PLATFORMS=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi

            BIN_NAME="mdee${EXT}"
            ARCHIVE_DIR="mdee-${TAG_NAME}-${GOOS}-${GOARCH}"
            mkdir -p "dist/${ARCHIVE_DIR}"

            echo "Building for ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/${ARCHIVE_DIR}/${BIN_NAME}" ./cmd/mdee

            cp README.md LICENSE "dist/${ARCHIVE_DIR}/"

            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -q -r "${ARCHIVE_DIR}.zip" "${ARCHIVE_DIR}")
            else
              tar -czf "dist/${ARCHIVE_DIR}.tar.gz" -C dist "${ARCHIVE_DIR}"
            fi

            rm -rf "dist/${ARCHIVE_DIR}"
          done

          # Generate SHA256 checksums
          (cd dist && sha256sum mdee-* > checksums.txt)

          # Generate Homebrew formula BEFORE release creation so dist/* includes it atomically
          chmod +x scripts/generate_formula.sh
          ./scripts/generate_formula.sh "$VERSION" "$TAG_NAME" "dist" "dist/mdee.rb"

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            dist/*

      - name: Publish Homebrew Formula to Tap
        if: steps.version.outputs.skip != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          # Push to smford/homebrew-tap if TAP_TOKEN secret is configured
          if [ -n "${TAP_TOKEN}" ]; then
            echo "Publishing updated formula to smford/homebrew-tap..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/smford/homebrew-tap.git" tap_repo
            mkdir -p tap_repo/Formula
            cp dist/mdee.rb tap_repo/Formula/mdee.rb
            cd tap_repo
            git add Formula/mdee.rb
            if git commit -m "feat(formula): update mdee to ${TAG_NAME}"; then
              git push origin main
              echo "Successfully pushed formula update to smford/homebrew-tap"
            else
              echo "Formula in tap is already up to date"
            fi
            cd ..
            rm -rf tap_repo
          else
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set. Formula available in release assets."
          fi
